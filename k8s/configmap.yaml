apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: confuse
data:
  # Auth0 Public Configuration
  NEXT_PUBLIC_AUTH0_DOMAIN: "dev-pmspwseo1uaudyoi.jp.auth0.com"
  NEXT_PUBLIC_AUTH0_ISSUER: "https://dev-pmspwseo1uaudyoi.jp.auth0.com/"
  NEXT_PUBLIC_AUTH0_AUDIENCE: "https://api.confuse.dev"
  
  # Application Configuration
  NODE_ENV: "production"
  PORT: "3000"
  
  # API Configuration
  NEXT_PUBLIC_API_BASE_URL: "https://api.confuse.dev"
  
  # Feature Flags
  NEXT_PUBLIC_ENABLE_ANALYTICS: "true"
  NEXT_PUBLIC_ENABLE_DEBUG: "false"
  NEXT_PUBLIC_ENABLE_BETA_FEATURES: "false"
  
  # UI Configuration
  NEXT_PUBLIC_THEME: "light"
  NEXT_PUBLIC_BRAND: "ConFuse"
  
  # Performance
  NEXT_PUBLIC_CACHE_ENABLED: "true"
  NEXT_PUBLIC_LAZY_LOADING: "true"
