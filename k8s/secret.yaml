apiVersion: v1
kind: Secret
metadata:
  name: frontend-secrets
  namespace: confuse
type: Opaque
stringData:
  # Auth0 Private Configuration
  AUTH0_CLIENT_ID: "your_auth0_client_id_here"
  AUTH0_CLIENT_SECRET: "your_auth0_client_secret_here"
  
  # Analytics Keys (if used)
  GOOGLE_ANALYTICS_ID: "GA_MEASUREMENT_ID"
  SENTRY_DSN: "sentry_dsn_here"
  
  # External API Keys
  MAPBOX_API_KEY: "mapbox_api_key_here"
  
  # Session Secrets
  SESSION_SECRET: "frontend_session_secret_here"
  
  # Build Secrets
  NEXTAUTH_SECRET: "nextauth_secret_here"
