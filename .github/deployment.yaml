# =============================================================================
# Frontend (Next.js) - Kubernetes Deployment
# Covers ALL .env variables via ConfigMap (non-sensitive)
# =============================================================================

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: confuse-platform
data:
  NODE_ENV: "production"
  PORT: "3000"
  # API URLs (internal cluster DNS)
  NEXT_PUBLIC_API_URL: "http://api-backend:8000"
  NEXT_PUBLIC_AUTH_URL: "http://auth-middleware:3010"
  NEXT_PUBLIC_FEATURE_TOGGLE_URL: "http://feature-toggle:3099"
  NEXT_PUBLIC_MCP_URL: "http://mcp-server:3004"
  # Auth0 (non-sensitive, public client config)
  NEXT_PUBLIC_AUTH0_DOMAIN: "dev-pmspwseo1uaudyoi.jp.auth0.com"
  NEXT_PUBLIC_AUTH0_AUDIENCE: "https://api.confuse.dev"
  NEXT_PUBLIC_AUTH0_CLIENT_ID: "Ne8pCTrBhnVC0rxa2RaD94eAdKId8SBj"
  NEXT_PUBLIC_AUTH0_REDIRECT_URI: "https://confuse.platform.example.com"
  NEXT_PUBLIC_AUTH0_LOGOUT_REDIRECT_URI: "https://confuse.platform.example.com/"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: confuse-platform
  labels:
    app: frontend
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        version: v1
    spec:
      imagePullSecrets:
      - name: acr-secret
      containers:
      - name: frontend
        image: "confuseimgr.azurecr.io/frontend:latest"
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        envFrom:
        - configMapRef:
            name: frontend-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: confuse-platform
spec:
  selector:
    app: frontend
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 3000
  type: LoadBalancer
